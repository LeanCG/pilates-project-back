version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pilates_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${PASSWORD:-L34ndr0.040}
      MYSQL_DATABASE: ${DATABASE:-pilates}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: pilates_backend
    restart: always
    environment:
      HOST: db
      USER_DATABASE: root
      PASSWORD: ${PASSWORD:-L34ndr0.040}
      DATABASE: ${DATABASE:-pilates}
      JWT_SECRET: ${JWT_SECRET:-your_dev_secret}
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: pilates_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mysql_data:
